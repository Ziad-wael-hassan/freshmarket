<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/branding/green-cart.svg" />
  <link rel="apple-touch-icon" href="/branding/green-cart.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#22c55e" />

  <!-- Dark mode FOUC prevention - must run BEFORE React loads -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme')
      const prefersDark = window.matchMedia(
        '(prefers-color-scheme: dark)'
      ).matches
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">

  <title>FreshCart — Premium E-Commerce Platform</title>
</head>

<body class="bg-main text-text-primary antialiased transition-colors duration-500 ease-in-out">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
